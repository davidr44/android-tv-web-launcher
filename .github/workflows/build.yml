name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Watch-time tests
        run: python3 tools/test.py
      - name: Build the APK
        # A throwaway key: CI only proves the APK builds. Real builds are signed with a key that never leaves the PC.
        env:
          INICIO_KEY_PASSWORD: ci-throwaway-key
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Inicio-ci-build
          path: Inicio.apk
